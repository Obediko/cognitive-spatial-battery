name: Static and scoring checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test Animal Semantic Fluency scoring
        run: node tests/animal_semantic_fluency.test.js
      - name: Test Original Visual Naming scoring
        run: node tests/original_visual_naming.test.js
      - name: Test Original Complex Figure scoring
        run: node tests/original_complex_figure.test.js
      - name: Test Original Number Span scoring
        run: node tests/original_number_span.test.js
      - name: Audit ETI core eight-score contract
        run: node tests/eti_core_eight_scores.test.js
