name: Static and scoring checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find js netlify/functions scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run all unit and integration tests
        run: npm run test:unit
      - name: Validate stimulus WAV files
        run: python3 scripts/audio_qa.py --check --output audio-qa-report.json
      - name: Upload acoustic QA report
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-qa-report
          path: audio-qa-report.json
      - name: Install browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: npm run test:e2e
