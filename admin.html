<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examiner Scoring Checkpoint — Cognitive Spatial Battery</title>
  <script src="https://unpkg.com/jspsych@7.3.4/dist/index.browser.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" />
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3/dist/index.browser.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-page">
  <main id="admin-shell" class="osr-card" style="max-width:1000px;margin:3rem auto;">
    <span class="osr-kicker">Authenticated examiner checkpoint</span>
    <h1>Scoring portal</h1>
    <section id="admin-login-panel">
      <div class="warning-box">Examiner access is restricted. Use the admin password configured privately in Netlify.</div>
      <label for="admin-password">Admin password</label>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0 1rem;">
        <input id="admin-password" type="password" autocomplete="current-password" style="flex:1;min-width:220px;" />
        <button class="battery-btn primary" id="admin-login">Sign in</button>
      </div>
    </section>
    <section id="admin-sessions-panel" hidden>
      <div style="display:flex;justify-content:space-between;gap:1rem;align-items:center;">
        <p>Remote sessions are synchronized through encrypted Netlify Blobs storage.</p>
        <button class="battery-btn" id="admin-logout">Sign out</button>
      </div>
      <p id="admin-status" class="osr-status" aria-live="polite"></p>
      <h2>Cross-device sessions</h2>
      <div id="admin-remote-session-list"></div>
      <h2>Sessions on this browser</h2>
      <div id="admin-local-session-list"></div>
    </section>
    <p class="osr-fineprint"><a href="index.html">Return to participant battery</a></p>
  </main>
  <div id="jspsych-target"></div>
  <script src="js/language.js"></script>
  <script src="js/task_language_data.js"></script>
  <script src="js/remote_sync.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/reporting.js"></script>
  <script src="js/tasks/osr_transcription.js"></script>
  <script src="js/tasks/original_story_recall.js"></script>
  <script src="js/tasks/animal_semantic_fluency.js"></script>
  <script src="js/tasks/original_visual_naming.js"></script>
  <script src="js/tasks/original_complex_figure.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
